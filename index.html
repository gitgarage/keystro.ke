<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>keystro.ke</title>

    <meta
        name="description"
        content="An open-source typing game focused on attention, rhythm, and long-term typing skill."
    >

    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <main id="app" class="app-shell">
        <section class="game-viewport" aria-label="Keystro.ke typing game demo">
            <header class="hud">
                <div class="brand">
                    <span class="brand-mark">keystro.ke</span>
                    <span class="build-label">v0.1 development</span>
                </div>

                <div class="combo-panel" aria-live="polite">
                    <span class="combo-label">Combo</span>
                    <span id="combo-value" class="combo-value">0</span>
                </div>
            </header>

            <div class="stage">
                <p class="stage-kicker">First playable loop</p>
                <h1 class="stage-title">Focus typing begins here.</h1>
                <p class="stage-copy">
                    The next step is to bring word targets onto the stage.
                </p>
            </div>
        </section>
    </main>

    <script src="src/main.js" defer></script>
</body>
</html>
